<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURRIS.SITE | Desarrollo Web Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0f1a',
                        darker: '#05080f',
                        accent: '#f59e0b',
                        vortex: '#8A2BE2',
                        vortexLight: '#00FFFF'
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(138, 43, 226, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(0, 255, 255, 0.6)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darker text-gray-200 font-sans antialiased">

    <!-- Navbar -->
    <nav class="fixed w-full z-40 bg-darker/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="text-2xl font-bold tracking-tighter flex items-end">
                CURRIS<span class="text-sm mb-1 ml-0.5 text-accent">.SITE</span>
            </div>
            <div class="hidden md:flex space-x-8">
                <a href="#servicios" class="hover:text-accent transition">Servicios</a>
                <a href="#portafolio" class="hover:text-accent transition">Portafolio</a>
                <a href="#contacto" class="hover:text-accent transition">Contacto</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-20 lg:pt-48 lg:pb-32 px-4 text-center">
        <h1 class="text-5xl md:text-7xl font-bold text-white mb-6">Tu presencia digital <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-yellow-300">comienza aquí</span></h1>
        <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-10">Desarrollo web moderno, rápido y profesional. Sin complicaciones.</p>
        <button class="bg-accent text-darker font-bold py-3 px-8 rounded-full hover:bg-yellow-400 transition shadow-lg shadow-accent/20">Solicitar Presupuesto</button>
    </section>

    <!-- VorteX FAB -->
    <button id="vortex-fab" class="fixed bottom-6 right-6 z-50 w-16 h-16 rounded-full bg-dark border border-white/10 shadow-2xl flex items-center justify-center animate-glow group transition-transform hover:scale-110" aria-label="Habla con VorteX">
        <img src="assets/images/vortex-logo.svg" alt="VorteX" class="w-10 h-10">
        <span class="absolute -top-12 right-0 bg-darker border border-white/10 text-xs px-3 py-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap text-vortexLight shadow-lg">
            Habla con VorteX
        </span>
    </button>

    <!-- VorteX Chat Interface -->
    <div id="vortex-window" class="fixed bottom-28 right-6 z-50 w-[90%] sm:w-[400px] h-[600px] max-h-[80vh] bg-dark border border-white/10 rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
        
        <!-- Header -->
        <div class="flex items-center justify-between p-4 bg-gradient-to-r from-dark to-darker border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-darker flex items-center justify-center border border-white/5 shadow-[0_0_15px_rgba(138,43,226,0.3)]">
                    <img src="assets/images/vortex-logo.svg" class="w-7 h-7">
                </div>
                <div>
                    <h3 class="font-bold text-gray-100 flex items-center gap-2">
                        VorteX <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    </h3>
                    <p class="text-[10px] text-vortexLight uppercase tracking-wider">Tu asesor inteligente</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="vortex-clear" class="text-gray-400 hover:text-white p-1" title="Limpiar historial">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
                <button id="vortex-close" class="text-gray-400 hover:text-white p-1" title="Cerrar">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="vortex-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-darker/60 scrollbar-hide">
            <!-- Dynamic Content -->
        </div>

        <!-- Input -->
        <div class="p-3 bg-dark border-t border-white/5">
            <div id="vortex-suggestions" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                <!-- Suggestions -->
            </div>
            <form id="vortex-form" class="flex gap-2 relative">
                <textarea id="vortex-input" rows="1" class="w-full bg-darker border border-white/10 rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-vortex/50 resize-none scrollbar-hide max-h-32" placeholder="Escribe tu consulta..."></textarea>
                <button type="submit" id="vortex-send" class="p-3 rounded-xl bg-vortex/20 text-vortexLight hover:bg-vortex/40 hover:text-white transition flex-shrink-0">
                    <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </form>
            <div class="text-center mt-2 flex items-center justify-center gap-1">
                <span class="text-[9px] text-gray-500 uppercase tracking-widest">Powered by Google Gemini</span>
            </div>
        </div>
    </div>

    <!-- Modulos JS como tipo module -->
    <script type="module" src="js/vortex-main.js"></script>
</body>
</html>
